name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Extract version from tag
        id: tag_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update composer.json version
        run: |
          php -r "
          \$file = 'composer.json';
          \$data = json_decode(file_get_contents(\$file), true);
          \$data['version'] = '${{ steps.tag_version.outputs.version }}';
          file_put_contents(\$file, json_encode(\$data, JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT) . PHP_EOL);
          "

      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ steps.tag_version.outputs.version }}"
          DATE=$(date +"%Y-%m-%d")
          printf "## [%s] - %s\n\n### Added\n-\n\n### Changed\n-\n\n### Fixed\n-\n\n" "$VERSION" "$DATE" > /tmp/changelog_entry.md
          sed -i "3r /tmp/changelog_entry.md" CHANGELOG.md

      - name: Commit changes
        run: |
          git add composer.json CHANGELOG.md
          git commit -m "chore: release v${{ steps.tag_version.outputs.version }}" || true

      - name: Push changes
        run: |
          git push origin main || true

      - name: Create GitHub Release
        run: |
          VERSION="v${{ steps.tag_version.outputs.version }}"
          TITLE="Release v${{ steps.tag_version.outputs.version }}"
          NOTES="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          if gh release view "$VERSION" &>/dev/null; then
            gh release edit "$VERSION" --title "$TITLE" --notes "$NOTES" --draft=false
          else
            gh release create "$VERSION" --title "$TITLE" --notes "$NOTES"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
